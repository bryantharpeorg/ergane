# Variant `forge-unknown`: the repo names a forge nothing is registered under.
#
# Well-formed in every other respect, so the only thing that can refuse it is the
# `forge` rule. The refusal is the point: a deployment that asked for one forge
# and silently got the default would open proposals, and land them, somewhere
# nobody was looking (049 FR-014).
version: 1
runtime: bwrap
gates:
  lint: "bash gates/lint.sh"
  test: "bash gates/test.sh"
  typecheck: "bash gates/typecheck.sh"
timeouts:
  lint: 30
forge: gitlab
