# Variant `landing-branch`: the repo declares its own landing branch.
# This is the US1 fixture for factories that land on a branch other than main.
version: 1
runtime: bwrap
gates:
  lint: "bash gates/lint.sh"
  test: "bash gates/test.sh"
  typecheck: "bash gates/typecheck.sh"
timeouts:
  lint: 30
landing_branch: ergane-buildout
