[project]
name = "ergane"
version = "0.1.0"
description = "Agentic software factory: per-node usage tracking, verification gating, merge queue"
requires-python = ">=3.11"
dependencies = [
    "temporalio",
    "httpx",
    "pyyaml",
]

[project.scripts]
factory-usage = "factory.usage.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_proxy: hits a real LiteLLM proxy; auto-skips unless LITELLM_PROXY_URL and LITELLM_MASTER_KEY are set",
]
