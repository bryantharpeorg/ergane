[project]
name = "ergane-cli"
version = "0.5.0"
description = "Agentic software factory: per-node usage tracking, verification gating, merge queue"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "Ergane contributors"},
]
keywords = ["ergane", "factory", "agentic", "workflow", "merge-queue"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "temporalio",
    "httpx",
    "pyyaml",
    "python-telegram-bot",
]

[project.urls]
Homepage = "https://github.com/bryantharpeorg/ergane"
Documentation = "https://github.com/bryantharpeorg/ergane/tree/main/docs"
Repository = "https://github.com/bryantharpeorg/ergane"
Issues = "https://github.com/bryantharpeorg/ergane/issues"
Changelog = "https://github.com/bryantharpeorg/ergane/blob/main/docs/decisions.md"

[project.scripts]
ergane = "factory.cli.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]
# Build residue, not source: three `.py.base` files landed with 011/us1
# (ed8f24c) that nothing in the tree reads. They were the wheel's *only*
# non-Python payload before this change; the pattern stays so the next leaked
# one does not ship either.
exclude = ["**/*.py.base"]

# The persona registry travels inside the package.
#
# Principle VII routes every node through `personas.yaml`, so an Ergane that
# cannot read one cannot dispatch an attempt, cannot run the roadmap preflight,
# and fails its own `ergane install` verification. The file is operator-editable
# config and stays at the repo root where a checkout, the docs and the specs all
# expect it; the wheel gets a copy at `factory/personas.yaml`, which is where
# `factory.config` resolves it from as package data. Without this key the wheel
# shipped no registry at all and the first thing a new install printed was
# `cannot read persona registry .../site-packages/personas.yaml`.
#
# The engine container's confinement artifacts travel the same way (spec 104):
# `ergane install` copies both beside the compose project it generates, so
# `security_opt`'s relative `./seccomp-ergane.json` resolves there rather than
# against a checkout the host may not have. Drop a key and a wheel install emits
# a project with no confinement contract. The `Dockerfile` cannot join them: it
# is `COPY . /opt/ergane`, so its context is the repo.
#
# The stack packs (057/US2) are deliberately *absent* from this table, and that
# is not an oversight: they live at `factory/stack_packs/*.yaml`, already inside
# the wheel's import package, so hatchling ships them without being told. Adding
# them here would install a second copy. What holds the guarantee is not this
# config but `test_every_shipped_pack_travels_in_the_wheel`, which reads a built
# wheel — an exclusion added below would show up there and nowhere else.
[tool.hatch.build.targets.wheel.force-include]
"personas.example.yaml" = "factory/personas.yaml"
"container/seccomp-ergane.json" = "factory/container/seccomp-ergane.json"
"container/ergane-engine.profile" = "factory/container/ergane-engine.profile"
"default_floor.md" = "factory/default_floor.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The declared gate adds -q; retain individual test names to identify CI stalls.
addopts = "-vv --durations=20"
markers = [
    "live_proxy: hits a real LiteLLM proxy; auto-skips unless LITELLM_PROXY_URL and LITELLM_MASTER_KEY are set",
    "live_telegram: hits the real Telegram Bot API; auto-skips unless TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are set",
    "live_epic: runs a live one-node epic; auto-skips unless Tier 1 env is set",
    "live_merge: drives real PRs through the sample repo's merge queue; auto-skips unless FACTORY_SAMPLE_REPO is set and gh is authenticated",
    "live_capacity: hits a real Temporal namespace; auto-skips unless a server answers at TEMPORAL_ADDRESS/TEMPORAL_NAMESPACE",
    "live_onramp: drives install through landing against a scratch org-owned repo; auto-skips unless every prerequisite in docs/onramp-exercise.md is present",
]
