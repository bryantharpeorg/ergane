# What "green" means for Ergane itself.
#
# This repo is the factory's first target (D-024): epic 003 is dispatched by the
# factory against this checkout, so every node that works here reads this file to
# learn which commands decide its fate. Declared, never auto-detected (D-009).
#
# Schema v2 — specs/002-verification-gating/contracts/factory-yaml.md, widened by
# 023-composable-verification. The bump from v1 is purely additive and was made on
# 2026-08-29 for the `ladder:` block at the bottom of this file: `_reject_unknown_keys`
# (factory/verify/factory_yaml.py:245) hands v2 the same key set as v1 plus `ladder`
# and `verify`, so nothing already declared here changes meaning.
#
# SAFE ONLY BECAUSE THE WORKER'S PARSER PREDATES THE EDIT. The config gate parses a
# node's manifest with the WORKER's installed parser, not the worktree's — see the
# `landing_branch` note below, which cost 020/US1 four deaths. v2 support landed
# 2026-08-17 (94ce324, spec 023) and this worker started 2026-08-29 04:15 UTC, so it
# reads v2. A worker older than that would reject this file wholesale at CONFIG_ERROR
# in 0.0s, before any gate command runs.

version: 2

# Reserved: v1 runs gates as subprocesses in the node worktree (002 research R3).
# It names a uv image rather than a bare `python:` one because the gate command
# below is `uv run` — the day the sandbox executor honours this field, the image
# it pulls has to be able to run it.
runtime: bwrap

# One gate, because one gate is what this repo has: `pytest` is the whole of its
# green. Declaring `lint`/`typecheck` here would fail every node — ruff and mypy
# are not on the approved dependency roster (constitution III), and a gate whose
# command is not installed is a FAIL, not a skip. They arrive together or not at
# all.
gates:
  test: "uv run pytest -q"

# The document every agent attempt in this repo is told to read and obey (005
# FR-006, research R11) — path relative to the repo root, checked for existence
# at dispatch in `prepare_worktree`. Ergane's standards are its constitution:
# test-first, no unapproved dependencies, no credentials in code or logs.
standards: .specify/memory/constitution.md

# The branch the factory lands on, declared rather than guessed (020-US1). Three
# parts of the tree used to disagree about this — `capture_base_ref` read the
# clone's checked-out branch, `derive --delta` hardcoded "main", and the CLI's
# `--default-branch` defaulted to "main" — so a clone left on the wrong branch
# quietly decided what every node of an epic built from. Absent, this still means
# "main", which is why every other target repo is unaffected.
#
# Declared by the operator, never by a node: the config gate parses a node's
# manifest with the *worker's* installed parser, not the worktree's, so a story
# that adds this key to its own manifest is rejected at CONFIG_ERROR in 0.0s
# before any gate command runs. 020's US1 died four times proving it. The key is
# safe here only because US1 landed (438cfd0) and the worker was restarted on it.
landing_branch: ergane-buildout

# The retry ladder. Declared 2026-08-29 (Bryan): "build 1 and 2 on the implementer
# persona, then build 3 on the closer (opus) persona."
#
# WHAT THE RUNGS ARE NOW, resolved through personas.yaml (corrected 2026-08-30,
# when `implementer` became a subscription persona — the table below had said
# `ollama-cloud/glm-5.3   gateway` since the rung was declared, and stopped being
# true the moment the registry flipped):
#   attempt 1-2  implementer  claude-opus-5          subscription
#   attempt 3    opus-closer  claude-opus-5          subscription   <- promotion rung
#   attempt 4    debugger     claude-opus-5          subscription
#   then         escalate to the operator
#
# All four rungs are now the same model on the same route, which drains most of
# the meaning out of the promotion rung: promoting from Opus to Opus buys a
# different prompt and nothing else. Left in place deliberately — the rung is
# still where a metered `closer` would go if this repo ever wanted one — but an
# operator reading a PROMOTE in a node's history should not expect a stronger
# model behind it.
#
# `max_attempts` IS THE ORDINARY BUDGET, NOT THE TOTAL. `next_action`
# (factory/verify/ladder.py:177) spends ordinary attempts first, then promotes, then
# runs the debugger cycle, then escalates — and `_attempts_spent` excludes both the
# debugger and the promotion persona from the ordinary count. So 2 here means two
# ordinary attempts and four attempts in total, not two.
#
# THE PROMOTION RUNG IS `opus-closer`, NOT `closer`, AND THE DIFFERENCE IS THE BILL.
# Both point at Opus 5. `closer` reaches it through the LiteLLM alias
# `anthropic/claude-opus-5` and bills per token; `opus-closer` runs on the operator's
# own Claude Code login and costs no metered spend. `closer`'s own registry entry says
# it is "opt-in... it must cost a decision, not a default", and naming it here would
# make it exactly the default it warns against. Using the metered route instead is a
# one-word change on the line below.
#
# ORDERING NOTE WORTH KEEPING: rungs 3 and 4 are the same model by design. A closer
# finishes and a debugger diagnoses — different skills and different prompts, same
# weights. Putting the metered `closer` at rung 3 would also mean paying per token on
# the earlier rung and nothing on the later one, which is backwards.
#
# `debugger_cycles` and `escalation_timeout_s` are left at their code defaults (1 and
# 3600 — models.py:710, not the 28800 a QuestionWorkflow's own timer uses; they are
# different clocks). Declaring a dial here freezes it; neither has needed moving.
#
# VERIFIED BY SIMULATION, not by reading: feeding `next_action` a failing history
# against this parsed block yields RETRY, RETRY, PROMOTE, DEBUGGER, ESCALATE.
ladder:
  max_attempts: 2
  promotion_cycles: 1
  promotion_persona: opus-closer

# The scheduler's own dials (034 FR-015).
#
# READ THIS BEFORE TRUSTING THE BLOCK: on THIS repo it is a declaration of intent
# and nothing reconciles it automatically. `ergane init` derives a schedule id from
# the repo slug — `ergane-roadmap-ergane` — and this factory's live schedule is the
# hand-made `ergane-roadmap` that predates that convention. The two ids do not
# match, so running `init` here would CREATE A SECOND SCHEDULE beside the live one
# rather than reconcile it. `RoadmapDials`' own docstring names this repo as the
# case it was written for: "`max_concurrent_epics` on the one hand-made roadmap was
# never changed."
#
# So the live schedule was updated in place on 2026-08-30, through
# `factory.roadmap.schedule.update_schedule` against id `ergane-roadmap`, changing
# only `max_concurrent_nodes`. That path was chosen over `desired_for_repo` because
# the live schedule's `target_repo` is `/home/admin/code/ergane-roadmap-target` —
# not this checkout — and its `landing_branch` is empty; a "desired" built from this
# manifest would have silently rewritten both.
#
# AND IT DOES NOT REACH THE RUNNING ROADMAP EITHER. A run compiles its dials at
# start and carries them verbatim across every continue-as-new boundary, so
# `ergane roadmap status` will keep reporting the old numbers until the current run
# ends and the schedule starts a fresh one.
#
# RAISED TO 2 ON 2026-08-30 (Bryan, watching). `max_concurrent_nodes` is READY NODES
# PER CHILD EPIC — two agents in two worktrees on one spec, not two specs at once.
# It sat at 1 from 2026-08-23, when a cap of 2 killed four of five nodes with
# "Session ID already in use": every node reused one `--session-id`. That is fixed —
# the id is a `workflow.uuid4()` per node — and a concurrent pair was run and landed
# on 2026-08-29 to prove it before this line was written.
#
# `max_concurrent_epics` STAYS AT 1 and the reason is the worker, not the agents.
# A landing that changes any type crossing the workflow boundary wedges every
# RUNNING workflow, because `workflow.unsafe.imports_passed_through()` resolves
# those types against the worker's boot-time modules; the fix is a worker restart,
# and a restart is illegal while an attempt is in flight. One epic at a time means
# one such blast radius at a time. That defect wedged this roadmap for fifty
# minutes on 2026-08-30 and is filed as
# `interpreter/a-fresh-epic-on-a-stale-worker-wedges-in-workflow-task-retry`.
#
# NEITHER DIAL REACHES A RUNNING EPIC. Both are compiled into a child's `EpicInput`
# at its own dispatch (`factory/cli/roadmap.py` says so where the operator is
# standing when they ask), so this takes effect on the next spec the roadmap picks
# up, never on the one already building.
roadmap:
  cadence_s: 300
  max_concurrent_epics: 1
  max_concurrent_nodes: 2
