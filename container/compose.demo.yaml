# Demonstration compose project for Ergane.
#
# This project is a demonstration with volume-local state. It is intended to be
# fetched and run on a machine that has never had Ergane installed. It does not
# land: it carries no merge queue, writes no PRs, and persists state only in the
# volumes created here. For the operational project — same-path mounts, host
# state, and generated project lifecycle — run `ergane install --engine=container`
# instead.
#
# Exactly one environment variable is required: the upstream model credential
# that the bundled LiteLLM gateway will proxy. Every other value has a working
# default baked into this file.

services:
  ergane:
    image: ghcr.io/bryantharpeorg/ergane:${ERGANE_VERSION}
    init: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # Both confinement profiles are unconfined here for the same reason, and
      # that reason is the delivery mechanism: this file is fetched on its own by
      # `curl … | docker compose -f -`, so it has no sibling files. A
      # `seccomp:./seccomp-ergane.json` reference resolves against the caller's
      # working directory and hard-fails with "opening seccomp profile … no such
      # file or directory" before any container starts. The operational project
      # (config G) is generated into a directory alongside its artifacts and
      # keeps both seccomp-ergane.json and apparmor=ergane-engine; this is
      # config F, and portability is the whole of its job.
      - seccomp:unconfined
      - apparmor=unconfined
    environment:
      # PATH/LANG/TERM/HOME are compose passthroughs from the container default.
      - PATH=/opt/ergane/.venv/bin:/usr/local/bin:/usr/bin
      - LANG=C.UTF-8
      - TERM=xterm
      - HOME=/home/ergane
      # State paths: in the demo they point at named volumes mounted below.
      - ERGANE_STATE_HOME=/home/ergane/.local/state/ergane
      - FACTORY_STATE_HOME=/home/ergane/.local/state/ergane
      - ERGANE_CONFIG_PATH=/home/ergane/.config/ergane/config.toml
      - FACTORY_CONFIG_PATH=/home/ergane/.config/ergane/config.toml
      # LiteLLM credential primitives: the master key is generated for the demo
      # by the gateway container; the API key is unused in gateway mode but kept
      # in the environment list with an empty default so the reference contract
      # is satisfied.
      - ERGANE_LLM_MASTER_KEY=${ERGANE_LLM_MASTER_KEY:-sk-dummy-master}
      - ERGANE_LLM_API_KEY=${ERGANE_LLM_API_KEY:-}
      # Memory and Temporal defaults for the demo project.
      - ERGANE_MEMORY_URL=
      - ERGANE_MEMORY_API_KEY=
      - TEMPORAL_ADDRESS=127.0.0.1:7233
      - TEMPORAL_NAMESPACE=ergane
      - ERGANE_TEMPORAL_API_KEY=
      # Telemetry and notifier defaults are intentionally empty in the demo.
      - ERGANE_OTLP_ENDPOINT=
      - TELEGRAM_BOT_TOKEN=
      - TELEGRAM_CHAT_ID=
      # Version source: the release workflow substitutes this with the tag it
      # is publishing (FR-017/FR-018). The fetched file carries the real tag.
      - ERGANE_VERSION=${ERGANE_VERSION}
      # Registry path: point at the bundled demo registry so the engine never
      # resolves to the shipped example/ aliases. The file is inside the image at
      # /opt/ergane because the Dockerfile copies the repository there.
      - ERGANE_PERSONAS_PATH=/opt/ergane/container/personas.demo.yaml
      - ERGANE_TEMPORAL_DB_FILENAME=/home/ergane/.local/state/ergane/temporal/engine.db
      # Optional GitHub credential. On a stock host `gh` is unauthenticated, so
      # `ergane install --verify` reports that fact rather than failing silently.
      # Set GH_TOKEN in your shell to authenticate `gh` inside the engine; the
      # demo itself does not require it to start.
      - GH_TOKEN=${GH_TOKEN:-}
    volumes:
      - ergane_state:/home/ergane/.local/state/ergane
      - ergane_supervision:/home/ergane/.local/state/ergane/supervision
      - ergane_config:/home/ergane/.config/ergane
      - ergane_repo:/home/ergane/repo
    networks:
      - ergane
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy

  gateway:
    image: ghcr.io/berriai/litellm:main-stable
    environment:
      - DATABASE_URL=postgresql://postgres:demo-password@postgres:5432/litellm
      - LITELLM_MASTER_KEY=${ERGANE_LLM_MASTER_KEY:-sk-dummy-master}
      - STORE_MODEL_IN_DB=True
      # The one required credential: forwarded to the upstream provider through
      # the bundled gateway config.
      - UPSTREAM_MODEL_API_KEY=${UPSTREAM_MODEL_API_KEY}
    volumes:
      - gateway_config:/app/config
    # The gateway's static config arrives as an inline compose config rather than
    # a bind of ./gateway-config.yaml. A relative bind source cannot work here:
    # this file is delivered on its own by `curl … | docker compose -f -`, and a
    # missing bind source is not an error — Docker silently creates it as a
    # root-owned empty DIRECTORY, so LiteLLM would find a directory where its
    # config file should be and fail without naming the cause.
    #
    # The content below is kept byte-identical to container/gateway-config.yaml,
    # which stays in the tree as the readable copy; the drift test asserts they
    # never diverge. Edit both, or neither.
    configs:
      - source: gateway_config_file
        target: /app/config.yaml
        mode: 0444
    networks:
      - ergane
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: ["--config", "/app/config.yaml"]

  postgres:
    image: postgres:16-alpine
    environment:
      # Baked default for a demo database reachable only on the compose network.
      # This is not a secret: the Postgres is not exposed to the host and holds
      # only LiteLLM key metadata for a throwaway demo.
      - POSTGRES_PASSWORD=demo-password
      - POSTGRES_DB=litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ergane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  ergane_state:
  ergane_supervision:
  ergane_config:
  ergane_repo:
  gateway_config:
  postgres_data:

networks:
  ergane:
    driver: bridge

configs:
  # Byte-identical to container/gateway-config.yaml — see the note on the
  # gateway service. tests/test_109_us2_demo_compose.py asserts they agree.
  gateway_config_file:
    content: |
      # LiteLLM proxy configuration for the Ergane demo project.
      #
      # This file is bundled with the demo compose project and mounted read-only into
      # the gateway container. It declares the model aliases the bundled persona
      # registry references and the upstream provider the operator's one required
      # credential reaches.

      model_list:
        - model_name: demo/implementer
          litellm_params:
            model: anthropic/claude-sonnet-4-20250514
            api_key: "os.environ/UPSTREAM_MODEL_API_KEY"
        - model_name: demo/judge
          litellm_params:
            model: anthropic/claude-sonnet-4-20250514
            api_key: "os.environ/UPSTREAM_MODEL_API_KEY"
        - model_name: demo/debugger
          litellm_params:
            model: anthropic/claude-sonnet-4-20250514
            api_key: "os.environ/UPSTREAM_MODEL_API_KEY"
        - model_name: demo/closer
          litellm_params:
            model: anthropic/claude-sonnet-4-20250514
            api_key: "os.environ/UPSTREAM_MODEL_API_KEY"
        - model_name: demo/architect
          litellm_params:
            model: anthropic/claude-sonnet-4-20250514
            api_key: "os.environ/UPSTREAM_MODEL_API_KEY"
        - model_name: demo/researcher
          litellm_params:
            model: anthropic/claude-sonnet-4-20250514
            api_key: "os.environ/UPSTREAM_MODEL_API_KEY"

      general_settings:
        master_key: "os.environ/LITELLM_MASTER_KEY"
        store_model_in_db: true
        database_url: "os.environ/DATABASE_URL"
