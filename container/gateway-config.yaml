# LiteLLM proxy configuration for the Ergane demo project.
#
# This file is bundled with the demo compose project and mounted read-only into
# the gateway container. It declares the model aliases the bundled persona
# registry references and the upstream provider the operator's one required
# credential reaches.

model_list:
  - model_name: demo/implementer
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: "os.environ/UPSTREAM_MODEL_API_KEY"
  - model_name: demo/judge
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: "os.environ/UPSTREAM_MODEL_API_KEY"
  - model_name: demo/debugger
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: "os.environ/UPSTREAM_MODEL_API_KEY"
  - model_name: demo/closer
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: "os.environ/UPSTREAM_MODEL_API_KEY"
  - model_name: demo/architect
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: "os.environ/UPSTREAM_MODEL_API_KEY"
  - model_name: demo/researcher
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: "os.environ/UPSTREAM_MODEL_API_KEY"

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  store_model_in_db: true
  database_url: "os.environ/DATABASE_URL"
