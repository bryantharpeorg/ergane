# TestPyPI rehearsal for the ergane-cli distribution.
#
# The operator registered a trusted publisher on test.pypi.org naming this
# repository and THIS FILENAME (bryantharpeorg/ergane, test-release.yml), so the
# name of this file is part of the credential. Renaming it revokes publishing.
#
# It exists so the first real publish is not the first publish. PyPI and TestPyPI
# both refuse reuse of a name-and-version pair forever, so a mistake found on
# test.pypi.org costs a version number in a sandbox instead of on the index
# people install from.
#
# FR-011: publishing is an explicit operator action. This workflow is reachable
# ONLY by `workflow_dispatch` -- no push, no pull_request, no merge_group -- so
# no dispatched agent and no ordinary CI run can reach it by doing its job.
name: test-release

on:
  workflow_dispatch:

jobs:
  build-and-publish-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Trusted publishing is an OIDC exchange, not a stored secret: this token
      # is the whole credential, and no PyPI token exists in this repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build distribution
        run: uv build --wheel

      - name: Validate wheel metadata and contents
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl | head -n1)
          if [ -z "${WHEEL}" ]; then
            echo "VALIDATION-FAIL: no wheel produced" >&2
            exit 1
          fi

          NAME=$(unzip -p "${WHEEL}" '*.dist-info/METADATA' | grep -m1 '^Name:' | sed 's/^Name: //')
          if [ "${NAME}" != "ergane-cli" ]; then
            echo "VALIDATION-FAIL: wheel Name is ${NAME}, expected ergane-cli" >&2
            exit 1
          fi

          if ! unzip -l "${WHEEL}" | grep -q 'factory/personas.yaml'; then
            echo "VALIDATION-FAIL: personas.yaml missing from wheel" >&2
            exit 1
          fi

          echo "Validation passed for ${WHEEL}"
          unzip -p "${WHEEL}" '*.dist-info/METADATA' | sed -n '1,20p'

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal that is run twice should report, not explode: TestPyPI
          # refuses a name-and-version pair it already holds, and that refusal is
          # expected on a re-run rather than a failure of this workflow.
          skip-existing: true

  build-and-publish-image-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # GHCR login uses ${{ github.token }}; no registry secret is stored in
      # this repository.
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/bryantharpeorg/ergane
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag from run id
        id: meta
        shell: bash
        run: |
          IMAGE_TAG="rehearsal-${{ github.run_id }}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REPOSITORY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push multi-arch image
        id: build
        shell: bash
        run: |
          START_TIME=$(date +%s)
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --tag "${IMAGE_REPOSITORY}:${{ steps.meta.outputs.image_tag }}" \
            --iidfile /tmp/image-digest.txt \
            --metadata-file /tmp/image-metadata.json \
            .
          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))
          TIMEOUT_MINUTES=90
          echo "BUILD-DURATION: elapsed=${ELAPSED}s timeout-minutes=${TIMEOUT_MINUTES}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign pushed image digest with cosign
        shell: bash
        run: |
          DIGEST="$(cat /tmp/image-digest.txt)"
          cosign sign --yes "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Assert both platforms are present in manifest
        shell: bash
        run: |
          INSPECT="$(docker buildx imagetools inspect \
            "${IMAGE_REPOSITORY}:${{ steps.meta.outputs.image_tag }}")"
          echo "${INSPECT}"
          for platform in linux/amd64 linux/arm64; do
            if ! grep -q "${platform}" <<<"${INSPECT}"; then
              echo "PLATFORM-MISSING: ${platform} not found in manifest" >&2
              exit 1
            fi
          done

      - name: Verify package linkage and visibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO_PATH="${IMAGE_REPOSITORY#ghcr.io/}"
          PKG_NAME="${REPO_PATH##*/}"
          OWNER="${{ github.repository_owner }}"
          PKG="$(gh api "orgs/${OWNER}/packages/container/${PKG_NAME}")"
          LINKED="$(jq -r '.repository.full_name // "UNLINKED"' <<<"${PKG}")"
          VIS="$(jq -r '.visibility' <<<"${PKG}")"

          EXPECTED_REPO="${{ github.repository }}"
          if [ "${LINKED}" != "${EXPECTED_REPO}" ]; then
            echo "PACKAGE-LINKAGE-FAIL: expected linked repository ${EXPECTED_REPO}, observed ${LINKED}" >&2
            exit 1
          fi

          if [ "${VIS}" != "public" ]; then
            echo "PACKAGE-VISIBILITY-FAIL: expected public, observed ${VIS}; change visibility at https://github.com/orgs/${OWNER}/packages/container/${PKG_NAME}/settings" >&2
            exit 1
          fi
