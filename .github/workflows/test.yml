# The check the merge queue requires. The job id is `test` because the check-run
# name must match the gate factory.yaml declares (`gates.test`) — 003's
# onboarding compares the two by name, and a mismatch parks every epic.
name: test

on:
  pull_request:
  merge_group:
  push:
    branches: [ergane-buildout, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q
