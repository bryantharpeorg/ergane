# Release workflow: operator-triggered publishing for the ergane-cli distribution.
#
# This workflow is intentionally NOT triggered by branch pushes, pull requests,
# or merge-group events. It runs only when an operator explicitly dispatches it
# from a version tag (e.g. via `git tag v0.2.0 && git push origin v0.2.0`).
#
# FR-011: no dispatched agent and no ordinary CI run may publish. The publish
# step is gated behind a tag event and a PyPI credential; without either, the
# workflow builds and validates the artifact, then stops cleanly.
#
# FR-012: a tag whose version does not match the declared `pyproject.toml`
# version is refused before any artifact is uploaded.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-image-preflight:
    # FR-011: build the image before anything irreversible, so a Dockerfile that
    # cannot build fails the release before the version tag is spent on PyPI.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for linux/amd64 without pushing
        shell: bash
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            .

  build-and-publish:
    needs: [build-image-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Validate tag against declared version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          DECLARED_VERSION=$(uv run --with tomli --python "${{ matrix.python-version || '3.12' }}" python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG_VERSION="${TAG#v}"
          if [ "${TAG_VERSION}" != "${DECLARED_VERSION}" ]; then
            echo "TAG-MISMATCH: tag ${TAG} (${TAG_VERSION}) does not match declared version ${DECLARED_VERSION}" >&2
            exit 1
          fi
          echo "Tag ${TAG} matches declared version ${DECLARED_VERSION}"

      - name: Build distribution
        run: uv build --wheel

      - name: Validate wheel metadata and contents
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl | head -n1)
          if [ -z "${WHEEL}" ]; then
            echo "VALIDATION-FAIL: no wheel produced" >&2
            exit 1
          fi

          NAME=$(unzip -p "${WHEEL}" '*.dist-info/METADATA' | grep -m1 '^Name:' | sed 's/^Name: //')
          if [ "${NAME}" != "ergane-cli" ]; then
            echo "VALIDATION-FAIL: wheel Name is ${NAME}, expected ergane-cli" >&2
            exit 1
          fi

          if ! unzip -l "${WHEEL}" | grep -q 'factory/personas.yaml'; then
            echo "VALIDATION-FAIL: personas.yaml missing from wheel" >&2
            exit 1
          fi

          echo "Validation passed for ${WHEEL}"

      - name: Publish to PyPI
        # Gate: only publish when this is a tag push and the OIDC credential is present.
        # On a fork or a branch run this step is skipped, so no accidental publish occurs.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  build-and-publish-image:
    needs: [build-and-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/bryantharpeorg/ergane
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag from git tag
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          IMAGE_TAG="${TAG#v}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REPOSITORY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push multi-arch image
        id: build
        shell: bash
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --tag "${IMAGE_REPOSITORY}:${{ steps.meta.outputs.image_tag }}" \
            --iidfile /tmp/image-digest.txt \
            --metadata-file /tmp/image-metadata.json \
            .

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign pushed image digest with cosign
        shell: bash
        run: |
          DIGEST="$(cat /tmp/image-digest.txt)"
          cosign sign --yes "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Assert both platforms are present in manifest
        shell: bash
        run: |
          INSPECT="$(docker buildx imagetools inspect \
            "${IMAGE_REPOSITORY}:${{ steps.meta.outputs.image_tag }}")"
          echo "${INSPECT}"
          for platform in linux/amd64 linux/arm64; do
            if ! grep -q "${platform}" <<<"${INSPECT}"; then
              echo "PLATFORM-MISSING: ${platform} not found in manifest" >&2
              exit 1
            fi
          done

  publish-compose-asset:
    # FR-017: publish the one-command demo compose file as a release asset.
    # This must run after the image job so the asset never names an image that
    # has not been pushed yet (failure mode 13 in a new costume).
    needs: [build-and-publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set release and image tag from git tag
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          IMAGE_TAG="${TAG#v}"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish compose demo asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ERGANE_VERSION: ${{ steps.meta.outputs.image_tag }}
        run: |
          tmpdir="$(mktemp -d)"
          # Substitute the version source so the fetched file names the real tag.
          python -c "
            import os
            version = os.environ['ERGANE_VERSION']
            with open('container/compose.demo.yaml') as f:
                content = f.read()
            content = content.replace('\${ERGANE_VERSION}', version)
            with open('${tmpdir}/compose.yaml', 'w') as f:
                f.write(content)
          "
          gh release upload "${{ steps.meta.outputs.release_tag }}" \
            "${tmpdir}/compose.yaml" --clobber --repo "${{ github.repository }}"

      - name: Assert published compose engine tag matches release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${{ steps.meta.outputs.release_tag }}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/compose.yaml"

          # Give the release asset a short window to become available.
          for _ in $(seq 1 6); do
            if curl -fsSL "${ASSET_URL}" -o /tmp/compose.yaml; then
              break
            fi
            sleep 10
          done

          if [ ! -f /tmp/compose.yaml ]; then
            echo "ASSET-MISSING: could not fetch published compose asset from ${ASSET_URL}" >&2
            exit 1
          fi

          PUBLISHED_IMAGE="$(grep -A 3 '^  ergane:' /tmp/compose.yaml | grep 'image:' | sed 's/^.*image: *//' | tr -d ' ')"
          PUBLISHED_TAG="${PUBLISHED_IMAGE##*:}"
          if [ "${PUBLISHED_TAG}" != "${IMAGE_TAG}" ]; then
            echo "TAG-MISMATCH: published compose image tag ${PUBLISHED_TAG} does not match release tag ${IMAGE_TAG} (image: ${PUBLISHED_IMAGE})" >&2
            exit 1
          fi
          echo "Published compose asset tag ${PUBLISHED_TAG} matches release tag ${IMAGE_TAG}"
