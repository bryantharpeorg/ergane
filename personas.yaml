# Persona registry for the Ergane factory repository.
#
# This file is the operator wiring for *this* repository; it is not shipped in
# the wheel.  The packaged example lives in `personas.example.yaml` and is
# copied to `~/.config/ergane/personas.yaml` by `ergane install`.
#
# Nodes are routed by persona, never by model tier. This registry is the only
# place a model name appears — code never hardcodes one. The `model` and
# `fallback` values are LiteLLM aliases from the operator's proxy config.
#
# Whether the binding is enforceable depends on the LLM mode declared in the
# control-plane config:
#
# - In `gateway` mode the factory issues each attempt a model-constrained
#   virtual key whose `models` list is derived from this registry, so the
#   persona-to-model binding is enforceable.
# - In `direct` mode the factory hands the agent the operator's static provider
#   key and does not model-constrain it, so the binding is advisory rather than
#   enforceable (055-US2 FR-011).
#
# Current wiring (2026-09-06, Bryan 2026-09-05 — the four-rung ladder change;
# the per-persona history blocks below carry the full lineage, and ergane.yaml
# carries the rung table): every build rung rides the flat-rate Ollama gateway
# on Zhipu — `glm-5.3-flash` (implementer), `glm-5.3` (closer, debugger) — and
# every verdict is judged by Moonshot (`kimi-k3`). Architect and researcher
# stay on `ollama-cloud/deepseek-v4-flash`. Judge's fallback is null
# deliberately — a judge outage is loud rather than same-family — and every
# other non-subscription persona keeps `local/qwen3.6-27b`. `opus-closer`
# remains on the Claude subscription as the opt-in metered seat, untouched.
#
# Skill scope (062-US3 FR-010).
#
# The `skills` field below is parsed and validated, but it is reserved and
# unused: the factory constructs a per-node, factory-owned HOME at dispatch
# (`factory/workgraph/adapter.py:339`), so home-scoped agent skills that live in
# `$HOME/.claude/skills/` are invisible to a node. Project-scoped skills
# committed at `<repo>/.claude/skills/` are visible, because worktrees carry
# committed files into the node worktree.
#
# Fields per persona:
#   agent          adapter name (D-018); "none" = deterministic persona, no key
#   model          LiteLLM alias; required iff agent != "none", null iff "none"
#   fallback       LiteLLM alias used on primary-model failure; optional (null)
#   skills         reserved and unused; parsed only for backward compatibility
#   write_scope    worktree | docs | read  (drives component 2's diff exemption)
#   needs_worktree whether the node runs against an isolated git worktree
#   timeout        attempt wall-clock bound in SECONDS; positive integer, and
#                  null iff agent is "none". Edit these freely — they are the
#                  operator's dial, and no timeout is hardcoded anywhere in the
#                  code (FR-010). A node's `## Work Graph` override wins over
#                  the value here when one is declared.
#   context_window model context-window tokens, optional. Declare only what the
#                  operator knows; the adapter emits `CLAUDE_CODE_MAX_CONTEXT_TOKENS`
#                  only when this is set, and an unset declaration keeps today's
#                  behavior (FR-010). Forbidden on `agent: none`.
#
# `budget_usd` and `breach_policy` are intentionally absent — budget enforcement
# is deferred to spec 004 and those fields return with it.

architect:
  agent: claude-code
  model: ollama-cloud/deepseek-v4-flash
  fallback: local/qwen3.6-27b
  skills: [codebase-design, design-an-interface, domain-modeling]
  write_scope: docs
  needs_worktree: true
  timeout: 7200

implementer:
  # SWAPPED TO THE SUBSCRIPTION OPUS ROUTE 2026-08-29 ~12:30 AM CT (Bryan),
  # for the defect sprint that dispatches specs 089-120. The instruction was
  # "run everything as opus closer", and this is the only place that can express
  # it: `derive.py` hardcodes `persona=IMPLEMENTER` and *refuses* a `persona:`
  # key in a spec's `## Work Graph`, and neither `build start` nor
  # `roadmap start` has a builder-persona dial — only `--promotion-persona`.
  # So "everything" means this entry and `debugger` below.
  #
  # THE LINEAGE DOCTRINE SURVIVES THE SWAP. The rule this file has carried since
  # 2026-08-07 is that the judge may not review its own family's output (U3).
  # Anthropic now authors and Zhipu still judges, so the constraint holds — it
  # was kimi/glm, it is now opus/glm.
  #
  # WHAT THE PREVIOUS WIRING WAS, so reverting is one edit: kimi was chosen
  # 2026-08-07 ~22:45 CT to extend the homelab's ADR-0016 lineage doctrine —
  # `model: ollama-cloud/kimi-k2.7-code`, `fallback: local/qwen3.6-27b`,
  # `context_window: 262144` (256K per the ollama.com model card,
  # operator-confirmed 2026-08-11; without it the CLI assumes 200k for the
  # unrecognised alias and 62,144 tokens — 23.7% — of every attempt's window are
  # unreachable, measured on 032/us1 via Langfuse).
  #
  # HELD, NOT ABANDONED — 2026-08-29 00:45 CT. The swap below was applied and
  # then reverted within the hour, because it reddens trunk and therefore makes
  # the very sprint it was for undispatchable. Two tests assume the default
  # builder persona routes through the gateway:
  #   tests/test_us2_shipped_registry.py:344  asserts a "/" in implementer.model
  #   tests/test_usage_activities.py:819-834  leases a virtual key for it
  # A subscription persona has neither a slash-shaped alias nor a minted key, so
  # both fail, the gate command fails with them, and no node of any epic can
  # land. Filed as `ci/test-suite-pins-the-operator-dial` — the THIRD recurrence
  # of a defect 037 already un-pinned once for `context_window`.
  #
  # TO APPLY THE SWAP once that finding is fixed, replace the four keys below
  # with:
  #   agent: subscription
  #   model: claude-opus-5
  #   fallback: null
  #   context_window: 1000000
  # and note the cost: the fallback goes away. See the `opus-closer` entry for
  # why a `ollama-cloud/*` fallback cannot be kept on a subscription persona —
  # it holds no gateway key, so such a fallback validates cleanly and then fails
  # at runtime with nothing to authenticate against. A session that cannot
  # refresh therefore has no second route, which is what spec 095 makes legible.
  # POINTED AT GLM 5.3 ON 2026-08-29 ~9:10 AM CT (Bryan): "glm 5.3 for coding,
  # kimi k2.7 code for the judge, opus 5 as the debugger". All three rungs moved
  # together; see `judge` and `debugger` below.
  #
  # THE ALIAS HAD TO BE CREATED FIRST, and the reason matters for the next
  # person who reaches for a model the proxy 404s. At 9:10 AM the gateway served
  # 17 aliases and the only 5.3 among them was `-flash`, which reads as "Ollama
  # has no full 5.3". It does. Probed directly against https://ollama.com/v1
  # from inside the litellm container: both `glm-5.3` and `glm-5.3:cloud`
  # returned HTTP 200, content='ready', finish=stop. The alias was then added to
  # the homelab config (`stacks/llm/litellm/config.yaml`) and the proxy
  # restarted, taking it to 18. `ollama-cloud/glm-5.3` is probe-verified through
  # the gateway, not merely listed.
  #
  # A MISSING ALIAS AND A MISSING MODEL LOOK IDENTICAL FROM THE FACTORY SIDE.
  # Both present as a builder that fails every attempt while the gateway looks
  # broken. Probe the upstream before concluding the model does not exist.
  #
  # LINEAGE HOLDS, AND IT IS STRONGER THAN IT WAS. The rule since 2026-08-07 is
  # that the judge may not review its own family's output. This rotation puts
  # three distinct vendors on the three rungs — Zhipu builds, Moonshot judges,
  # Anthropic debugs — where before it was two.
  # MOVED TO THE FLASH VARIANT 2026-08-29 11:25 AM CT by the away-mode loop,
  # after `ollama-cloud/glm-5.3` was measured unusable as a builder. This still
  # honours the instruction ("glm 5.3 for coding") — it is the same family and
  # the same release, and it is the only one of the two that returns code.
  #
  # THE MEASUREMENT, because the failure mode looks like a broken gateway and is
  # not. `ollama-cloud/glm-5.3` is a reasoning model that spends its whole token
  # budget thinking and returns an EMPTY `content`:
  #
  #   trivial prompt, max_tokens 2000   -> 'ready', finish=stop, seconds
  #   real coding prompt, max_tokens 4000  -> 0 chars, finish=LENGTH,
  #                                           4000 completion tokens burned, 44s
  #   real coding prompt, max_tokens 16000 -> no response at all within 120s
  #   glm-5.3-flash, same prompt, 4000     -> 2461 chars, finish=stop, 18.8s
  #
  # The first line is why the alias probe passed at 09:20 and the wiring still
  # broke: a one-word answer fits inside the reasoning budget, a function does
  # not. AN ALIAS PROBE IS NOT A CAPABILITY PROBE. Probe with a prompt shaped
  # like the work, not with "reply with ready".
  #
  # What the node saw: `121/us1` attempt 1 died with a 36-byte stdout.log reading
  # `API Error: The operation timed out.` — no commits, no diff, spend still
  # climbing. The empty-content case and the timeout case are the same defect at
  # two budgets.
  #
  # Related and previously known for kimi:
  # `litellm-nil-content` / "a reasoning model with a tight max_tokens returns
  # empty content that looks like a broken gateway". Same shape, new model.
  # BACK TO THE FULL 5.3 ON 2026-08-29 3:50 PM CT (Bryan): "switch the glm 5.3
  # flash over to glm 5.3 full, see if it does any better as a primary builder."
  #
  # AND THE MORNING'S VERDICT ON THIS MODEL WAS WRONG. It was recorded as unable
  # to return code. It is not. It is a reasoning model that needs headroom, and
  # both probes that condemned it starved it:
  #
  #   max_tokens 4000   -> 0 chars, finish=length, 4000 burned   (too small)
  #   max_tokens 16000  -> no answer inside a 120s curl timeout  (MY timeout)
  #   max_tokens 32000  -> 2888 chars, finish=stop, 80s          (works)
  #
  # That last run spent 53,547 characters of reasoning and 14,875 completion
  # tokens before emitting a line. Give it room and it answers; starve it and it
  # returns an empty `content` that looks exactly like a broken gateway.
  # `agent/a-reasoning-model-passes-the-alias-probe-and-returns-no-code` has been
  # corrected to say so.
  #
  # WHAT IS STILL UNKNOWN, and is the reason this is an experiment rather than a
  # fix: the agent that failed at 10:55 died with `API Error: The operation timed
  # out`, and the CLI chooses its own request budget and deadline. A model that
  # needs 80 seconds and 15k tokens per turn may still exceed what the runner
  # allows, in which case this fails the same way and the answer is flash.
  #
  # LINEAGE IS UNAFFECTED: flash and full are both Zhipu, so the three rungs stay
  # Zhipu / Moonshot / Anthropic. No conflict arose, so the deepseek-v4-pro
  # fallback the operator offered is not needed -- and is not currently served by
  # the gateway anyway; only `ollama-cloud/deepseek-v4-flash` has an alias.
  # PRIMARY BUILDER IS NOW OPUS ON THE SUBSCRIPTION, 2026-08-29 11:24 PM CT
  # (Bryan: "i want the implementer to default to the opus-closer persona,
  # that's all"). This edit was impossible until spec 122 landed at 11:22 --
  # applied on its own it failed 25 tests, because two fixtures encoded a guess
  # about which vendor the operator would pick:
  #   tests/test_us2_shipped_registry.py  assert "/" in implementer.model
  #   tests/test_usage_activities.py      PERSONA = "implementer"
  # A subscription persona's model has no slash and mints no virtual key, so
  # both refused. 122/US1 and US2 removed them; 122/US3 fixed three tests that
  # read the operator's real ledger. This repo's gate IS the suite, so until
  # that landed the swap would have failed every node, not merely a push.
  #
  # SAME ROUTE AS `opus-closer`, deliberately, not the `closer` alias: this runs
  # on the operator's own Claude Code login, so no virtual key is minted, no
  # ANTHROPIC_BASE_URL or AUTH_TOKEN reaches the child, and there is no metered
  # per-token spend. `closer` reaches the same model through the gateway and
  # bills; it stays opt-in for that reason.
  #
  # LINEAGE: Anthropic now builds and Moonshot judges (kimi), which keeps ADR
  # 0016's rule that the judge may not review its own family's output. The
  # debugger is also Anthropic -- that is a rung above the builder, not a judge,
  # so the constraint is untouched.
  #
  # THE COST OF THIS ROUTE IS THE FALLBACK. A subscription persona holds no
  # gateway key, so an `ollama-cloud/*` fallback would validate here and then
  # fail at runtime with nothing to authenticate against. Null is the honest
  # value: a session that cannot refresh has no second route.
  #
  # MEASURED, dispatch-to-merged, five completed stories on 2026-08-29:
  # 43, ~34, 41, ~42, ~42 minutes, every one a first attempt. Against kimi's
  # 29-minute median (which needed three attempts on its one hard story),
  # glm-5.3 full at 63, and glm-5.3-flash at a 123-minute median.
  #
  # DEEPSEEK V4 PRO WAS TRIED HERE AND REVERTED THE SAME DAY, 2026-08-30, on
  # speed. Bryan: "if opus is that much faster just move fully to opus again.
  # lots of good data, but, want speed as well." Keeping the result so nobody
  # re-runs the experiment by accident:
  #
  #   deepseek-v4-pro   095/us2   ~69 min agent time, PASS on attempt 1
  #   claude-opus-5     five stories on 2026-08-30, 8-25 min agent time each
  #
  # So roughly 3-8x slower per story on this codebase. It is NOT a quality
  # problem — it passed its gate first try in 6m30s, indistinguishable from
  # every Opus gate that day, and wrote 448 insertions across 13 files with a
  # 267-line test written first. It is purely throughput.
  #
  # TWO THINGS LEARNED THAT OUTLIVE THE REVERT. First, deepseek committed
  # nothing itself: its whole contribution arrived as one `salvage(...)` commit,
  # where Opus commits in labelled stages. That matters because the judge scores
  # a diff and because history is read by people. Second, it is a reasoning
  # model whose reasoning is billed to the completion, so a tight `max_tokens`
  # returns empty content that reads as a broken gateway — the trap that killed
  # a node on glm-5.3, filed as
  # `agent/a-reasoning-model-passes-the-alias-probe-and-returns-no-code`.
  #
  # The gateway alias `ollama-cloud/deepseek-v4-pro` is left in place in the
  # homelab litellm config (branch `llm/deepseek-v4-pro-alias`, commit 0485191).
  # Reinstating this experiment is a four-line edit here, not an afternoon.
  # MOVED TO KIMI K2.7 CODE ON 2026-08-31 ~9:55 PM CT (Bryan): "run it on kimi
  # k2.7 code". This is the builder rung only — `opus-closer` and `debugger`
  # stay on Opus 5, which turns a ladder whose four rungs were the same model
  # into one with a real escalation gradient. Note the consequence: those two
  # rungs are subscription-routed and therefore still bounded by the OAuth
  # access token, so a story that burns two kimi attempts after the token
  # expires escalates into a rung that cannot authenticate. That is spec 125.
  #
  # PROBE-VERIFIED, NOT MERELY LISTED, 2026-08-31 9:52 PM CT through the gateway
  # at $LITELLM_PROXY_URL: `ollama-cloud/kimi-k2.7-code` returned
  # content='ready', finish_reason='stop', usage 15/33/48. The file's own lesson
  # is that a missing alias and a missing model look identical from the factory
  # side, so a probe rather than a `/v1/models` listing is what licenses this
  # edit. The gateway serves 19 aliases and this is one of them.
  #
  # THE LINEAGE DOCTRINE MOVED WITH IT. The judge may not review its own
  # family's output (U3, since 2026-08-07). Kimi was the judge until this edit,
  # so leaving it there would have put Moonshot on both ends; `judge` moves to
  # `ollama-cloud/glm-5.3` in the same breath. This is the exact mirror of the
  # 2026-08-29 arrangement, where glm built and kimi judged.
  #
  # ROUTE CHANGE, AND IT IS A BILL. `subscription` cost no metered spend;
  # `ollama-cloud/*` bills per token through LiteLLM. It also makes this rung
  # immune to the OAuth expiry that killed seven stories on 2026-08-31.
  # MOVED TO GLM 5.3 FLASH ON 2026-09-06 (Bryan, 2026-09-05): "attempts 1-2 on
  # glm-5.3-flash, promotion and debugger on glm-5.3, judge on kimi-k3". The
  # Claude subscription leaves the build ladder entirely — every rung is now on
  # the flat-rate Ollama gateway, so an expired OAuth login can no longer kill
  # a build, and no attempt touches metered Anthropic billing.
  #
  # THE LADDER THIS COMPLETES. One author lineage (Zhipu) on all three build
  # rungs — this persona, `closer`, `debugger` — and one judge lineage
  # (Moonshot) on the verdict, which is ADR 0016 / U3 satisfied on the cleanest
  # shape the doctrine allows: the 2026-08-07 arrangement inverted. The plan is
  # /home/admin/.claude/plans/ladder-change-2026-09-04.md; the recorded
  # promotion rung finally means something here, because promoting now moves
  # flash -> full 5.3 — genuinely stronger weights, not just a new prompt.
  #
  # BOTH GLM 5.3 ALIASES ARE PROVEN, NOT ASSUMED — this file's own history is
  # the proof. `ollama-cloud/glm-5.3` was probe-verified through the gateway on
  # 2026-08-31 (content='ready', finish=stop, usage 19/123/142) and both flash
  # and full ran as builders on 2026-08-29 with measured wall-times recorded
  # above. The known failure mode is recorded twice above and does not need a
  # third paragraph: these are reasoning models, a tight max_tokens returns
  # empty content that presents as a broken gateway, and an alias probe is not
  # a capability probe.
  # Operator selection restored after the repair-only Claude/Ollama bootstrap.
  # Deploy only with the landed and qualified Codex home repair (spec 164).
  # Model, fallback and gateway authentication are unchanged.
  agent: codex
  route: gateway
  model: ollama-cloud/glm-5.3-flash
  fallback: local/qwen3.6-27b
  skills: [implement, tdd]
  write_scope: worktree
  needs_worktree: true
  timeout: 14400
  # 1M per the ollama.com model card (/api/show: glm5_next -> 1,048,576),
  # verified 2026-09-05 and declared the day the alias took the rung. NOT
  # OPTIONAL: without it the CLI assumes 200k for an alias it does not
  # recognise, and on a 1M model that strands 80% — the 037 defect, measured on
  # this rung's predecessor at 23.7% of a 256k window on 032/us1.
  context_window: 1048576

verifier:
  agent: none
  model: null
  fallback: null
  skills: []
  write_scope: read
  needs_worktree: true
  timeout: null

judge:
  agent: claude-code
  # MOVED TO KIMI ON 2026-08-29 ~9:10 AM CT (Bryan), as one third of the rung
  # rotation recorded under `implementer`: glm builds, kimi judges, opus debugs.
  # Kimi was this repository's builder from 2026-08-07 until this morning, so
  # the alias is proven on the proxy — it is the same one every landed story
  # since then was written by.
  #
  # THE LINEAGE DOCTRINE IS WHY THIS IS A ROTATION AND NOT TWO EDITS. The judge
  # may not review its own family's output. Moving the builder to Zhipu made
  # Zhipu an illegal judge, so the judge had to move in the same breath. Reverting
  # one rung without the other silently puts glm on both ends.
  #
  # HISTORY, so a revert has somewhere to go: `ollama-cloud/glm-5.2` from
  # 2026-08-07, moved to `ollama-cloud/glm-5.3-flash` earlier on 2026-08-29
  # (the gateway serves no plain `ollama-cloud/glm-5.3` — see `implementer`).
  #
  # NO `context_window` HERE, ever: the judge is not a CLI-driven persona. It is
  # one bounded HTTP chat completion through the proxy (`factory/verify/judge.py`),
  # so `CLAUDE_CODE_MAX_CONTEXT_TOKENS` never reaches it and the key would be inert.
  # MOVED TO GLM 5.3 ON 2026-08-31 ~9:55 PM CT, as the other half of the
  # rotation recorded under `implementer`: kimi builds, glm judges. Kimi became
  # an illegal judge the moment it became the builder, so this edit is not
  # optional and is not separable — reverting one rung without the other
  # silently puts Moonshot on both ends.
  #
  # PROBE-VERIFIED 2026-08-31 9:53 PM CT through the gateway:
  # `ollama-cloud/glm-5.3` returned content='ready', finish_reason='stop',
  # usage 19/123/142. The note under `implementer` records that the plain
  # `ollama-cloud/glm-5.3` alias did not exist on 2026-08-29 and had to be
  # created in the homelab config; it exists now and it answers.
  # MOVED TO KIMI K3 ON 2026-09-06 (Bryan, 2026-09-05), completing the
  # four-rung ladder change recorded under `implementer`: Zhipu builds on all
  # three build rungs, Moonshot judges. This is the exact mirror of the
  # 2026-08-31 entry — kimi builds, glm judges — and the same non-separability
  # holds: reverting one rung without the other silently puts Zhipu on both
  # ends.
  #
  # K3 IS A REASONING MODEL, and this is the one seat where that bites. The
  # judge is a single bounded completion (`factory/verify/judge.py`): a tight
  # max_tokens returns empty `content` that presents as a broken gateway, and
  # `judge-blocked-by-reasoning-models` is a defect this floor has already paid
  # for. Probe it with a real judge-sized prompt — a diff plus criteria — never
  # with "reply with ready".
  #
  # FALLBACK IS NULL, DELIBERATELY (Bryan, 2026-09-06). Every build rung falls
  # back to `local/qwen3.6-27b`; if a build rung and the judge failed over in
  # the same attempt, qwen would review qwen — same-family review, which is
  # what U3 exists to forbid. A judge outage must be LOUD: `judge_unavailable`
  # on the record, never a silent verdict from inside the author's own family.
  # The pre-2026-09-06 value was `local/qwen3.6-27b` and the risk it carried is
  # pre-existing, not introduced here; the ladder change is simply the moment
  # it was decided.
  model: ollama-cloud/kimi-k3
  fallback: null
  skills: [code-review]
  write_scope: read
  needs_worktree: false
  timeout: 3600

closer:
  agent: codex
  route: gateway
  # Added 2026-08-13 (Bryan): the rung for a story that has already proved
  # stubborn. Deliberately NOT the debugger — a debugger diagnoses, a closer
  # finishes, so this carries the implementer's skills and write scope, not
  # `diagnosing-bugs`.
  #
  # This is the only persona routed to a metered provider. Everything else on
  # this floor rides the flat-rate Ollama subscription; `anthropic/claude-opus-5`
  # bills per token. That is the whole reason the persona is opt-in: it must
  # cost a decision, not a default.
  #
  # HOW TO USE IT — there is no automatic promotion today, by design and by
  # mechanism. `derive.py` hardcodes `persona=IMPLEMENTER` and *refuses* a
  # `persona:` key in a spec's `## Work Graph`, and `ladder.next_action` knows
  # only `DEBUGGER_PERSONA` by name. So a closer is dispatched by hand:
  #
  #   ergane spec derive <spec-dir> --target-repo <repo> --delta -o graph.json
  #   # edit graph.json: the stubborn node's "persona" -> "closer"
  #   ergane build start graph.json
  #
  # A typo fails closed, but later than you would like: the CLI does NOT catch
  # it (`_persona_registry` in `factory/cli/nouns/build.py` builds the registry
  # out of the graph's own persona names, so `validate_workgraph` can never
  # reject one, and preflight ignores unknown personas too). It is caught by
  # `resolve_graph` at epic start with `GRAPH_INVALID`, before any key is issued
  # or worktree created — cheap, but it costs a workflow rather than a command.
  # Filed as `interpreter/cli-cannot-reject-an-unknown-persona`. Verified live
  # 2026-08-13: a `closer` node resolves to `anthropic/claude-opus-5`, and
  # `clsoer` raises GRAPH_INVALID naming the registry.
  #
  # Promoting automatically on the third attempt is a separate change: it needs
  # `VerificationConfig.max_attempts` and a ladder rung, both factory code, and
  # therefore a spec. Do not hardcode a model name in code to get there —
  # constitution VII routes by persona, and this file is the only place a model
  # alias may appear.
  # REPOINTED AT GLM 5.3 ON 2026-09-06 (Bryan) as the ladder's promotion rung —
  # the separate change the paragraph above said was needed, now made: this
  # persona is named by `ladder.promotion_persona` in ergane.yaml, so a story
  # that spends its two ordinary attempts is promoted here automatically, no
  # hand-edited graph required.
  #
  # THE 2026-08-13 TEXT ABOVE DESCRIBES A PERSONA THAT NO LONGER EXISTS. It was
  # written when `closer` pointed at `anthropic/claude-opus-5` through the
  # gateway — the only metered seat on the floor, deliberately opt-in. The
  # 2026-09-05 ladder ruling retired that seat: Opus left the build ladder
  # entirely, and the promotion rung became flash -> full 5.3. The metered
  # opt-in survives as `opus-closer` below, untouched, for an operator who
  # wants it by hand.
  #
  # WHAT PROMOTING NOW BUYS: genuinely stronger weights, not a new prompt —
  # glm-5.3-flash on the ordinary rungs, glm-5.3 here. Both are Zhipu, so the
  # lineage held by the judge (Moonshot) is untouched — and this rung joins the
  # single author lineage rather than adding a third vendor.
  #
  # SAME-MODEL-AS-THE-DEBUGGER, BY DESIGN AND PRECEDENT: rungs 3 and 4 share
  # weights because a closer finishes and a debugger diagnoses — different
  # skills and prompts, same model. ergane.yaml's ladder block made that
  # argument first; it is kept because the shape recurs.
  model: ollama-cloud/glm-5.3
  # The house fallback, restored with the route change: the old
  # `ollama-cloud/kimi-k2.7-code` fallback is now a LINEAGE LEAK — Moonshot
  # judges every verdict, and a failed-over Moonshot closer would put its
  # output in front of its own family. The old text argued against
  # `local/qwen3.6-27b` on capability grounds; trap 6 of the ladder-change plan
  # weighs that against the same-family risk and leaves the house value
  # standing, as it does on every other build rung.
  fallback: local/qwen3.6-27b
  skills: [implement, tdd]
  write_scope: worktree
  needs_worktree: true
  timeout: 14400
  # 1M per the ollama.com model card (/api/show: glm_dsa_moe -> 1,048,576),
  # declared the day the alias took the rung. Same 037-defect reasoning as
  # `implementer`: unset, the CLI assumes 200k and strands 80% of the window.
  context_window: 1048576

debugger:
  # Swapped with `implementer` on 2026-08-29 for the defect sprint (Bryan,
  # "run everything as opus closer"). The debugger is the ladder's second rung —
  # `ladder.next_action` knows it by name — so leaving it on deepseek would mean
  # "everything" was true for three attempts and false for the three after,
  # which is the shadowing this sprint's spec 095 is about elsewhere.
  #
  # APPLIED 2026-08-29 ~9:10 AM CT (Bryan): "opus 5 as the debugger". The hold
  # recorded above was never about this entry — it was about `implementer`, and
  # specifically about two tests that pin the DEFAULT BUILDER:
  #   tests/test_us2_shipped_registry.py:344  asserts a "/" in implementer.model
  #   tests/test_usage_activities.py:819-834  leases a virtual key for it
  # Neither names `debugger`, and a grep of the suite finds no test that reads
  # this entry's model at all. So the swap that reddens trunk on the implementer
  # is free here, and `ci/test-suite-pins-the-operator-dial` does not block it.
  #
  # SUBSCRIPTION, NOT THE GATEWAY ALIAS. `anthropic/claude-opus-5` is served by
  # the proxy and `closer` uses it, but it bills per token. This route runs on
  # the operator's own Claude Code login and costs no metered spend, which is
  # the standing preference. The rung fires only after three ordinary attempts
  # have failed, so it is rare by construction — but a rare rung on a metered
  # model is still a bill nobody decided to pay.
  #
  # THE COST OF THE ROUTE IS THE FALLBACK. A subscription persona holds no
  # gateway key, so an `ollama-cloud/*` fallback would validate here and then
  # fail at runtime with nothing to authenticate against. Null is the honest
  # value: a session that cannot refresh has no second route, which is exactly
  # what spec 095 makes legible.
  # MOVED TO GLM 5.3 ON THE GATEWAY ON 2026-09-06 (Bryan, 2026-09-05): the last
  # rung of the four-rung ladder change, and the edit that takes Opus off the
  # ladder entirely. All three build rungs now share one author lineage
  # (Zhipu); the judge is Moonshot. The subscription reasoning above is kept
  # verbatim because it is the honest record of why this rung was ever off the
  # gateway — and because the two paragraphs below it record the exact
  # considerations a revert would need to re-litigate.
  #
  # THE FALLBACK PARAGRAPH ABOVE EXPIRED WITH THE ROUTE, and it is rewritten
  # here rather than left standing: it argued that null is honest *because* a
  # subscription persona holds no gateway key. A gateway persona holds one, so
  # the honest value is now the house fallback shared by every other build
  # rung. What this route change actually costs and buys is recorded in
  # ergane.yaml's ladder block: the ledger will start attributing dollars to
  # rung 4 where it attributed none, which reads as a cost increase that did
  # not happen — and in exchange an expired Claude login can no longer kill a
  # build that reaches this rung.
  agent: codex
  route: gateway
  model: ollama-cloud/glm-5.3
  fallback: local/qwen3.6-27b
  skills: [diagnosing-bugs]
  write_scope: worktree
  needs_worktree: true
  timeout: 10800
  # 1M per the ollama.com model card (/api/show: glm_dsa_moe -> 1,048,576),
  # declared the day the route changed. This persona is newly CLI-driven as of
  # the edit above, so the key is newly load-bearing: unset, the CLI assumes
  # 200k for an alias it does not recognise — the 037 defect that cost kimi
  # 23.7% of its window, now four fifths on a 1M model.
  context_window: 1048576

researcher:
  agent: claude-code
