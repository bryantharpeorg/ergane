# Persona registry for the Ergane factory repository.
#
# This file is the operator wiring for *this* repository; it is not shipped in
# the wheel.  The packaged example lives in `personas.example.yaml` and is
# copied to `~/.config/ergane/personas.yaml` by `ergane install`.
#
# Nodes are routed by persona, never by model tier. This registry is the only
# place a model name appears — code never hardcodes one. The `model` and
# `fallback` values are LiteLLM aliases from the operator's proxy config.
#
# Whether the binding is enforceable depends on the LLM mode declared in the
# control-plane config:
#
# - In `gateway` mode the factory issues each attempt a model-constrained
#   virtual key whose `models` list is derived from this registry, so the
#   persona-to-model binding is enforceable.
# - In `direct` mode the factory hands the agent the operator's static provider
#   key and does not model-constrain it, so the binding is advisory rather than
#   enforceable (055-US2 FR-011).
#
# Current wiring (2026-08-06, Bryan): hosted models via the proxy's
# `ollama-cloud/*` aliases (Ollama Cloud key on the worker host — the planned
# `anthropic/*` route was dropped in its favor). Coding personas and researcher
# run `ollama-cloud/deepseek-v4-flash` (the 0731 release); judge runs
# `ollama-cloud/glm-5.2` (top agent_loop in the operator's evals, and the
# claude-CLI-against-GLM path is precedented). Every persona keeps
# `local/qwen3.6-27b` as fallback.
#
# Skill scope (062-US3 FR-010).
#
# The `skills` field below is parsed and validated, but it is reserved and
# unused: the factory constructs a per-node, factory-owned HOME at dispatch
# (`factory/workgraph/adapter.py:339`), so home-scoped agent skills that live in
# `$HOME/.claude/skills/` are invisible to a node. Project-scoped skills
# committed at `<repo>/.claude/skills/` are visible, because worktrees carry
# committed files into the node worktree.
#
# Fields per persona:
#   agent          adapter name (D-018); "none" = deterministic persona, no key
#   model          LiteLLM alias; required iff agent != "none", null iff "none"
#   fallback       LiteLLM alias used on primary-model failure; optional (null)
#   skills         reserved and unused; parsed only for backward compatibility
#   write_scope    worktree | docs | read  (drives component 2's diff exemption)
#   needs_worktree whether the node runs against an isolated git worktree
#   timeout        attempt wall-clock bound in SECONDS; positive integer, and
#                  null iff agent is "none". Edit these freely — they are the
#                  operator's dial, and no timeout is hardcoded anywhere in the
#                  code (FR-010). A node's `## Work Graph` override wins over
#                  the value here when one is declared.
#   context_window model context-window tokens, optional. Declare only what the
#                  operator knows; the adapter emits `CLAUDE_CODE_MAX_CONTEXT_TOKENS`
#                  only when this is set, and an unset declaration keeps today's
#                  behavior (FR-010). Forbidden on `agent: none`.
#
# `budget_usd` and `breach_policy` are intentionally absent — budget enforcement
# is deferred to spec 004 and those fields return with it.

architect:
  agent: claude-code
  model: ollama-cloud/deepseek-v4-flash
  fallback: local/qwen3.6-27b
  skills: [codebase-design, design-an-interface, domain-modeling]
  write_scope: docs
  needs_worktree: true
  timeout: 7200

implementer:
  # SWAPPED TO THE SUBSCRIPTION OPUS ROUTE 2026-08-29 ~12:30 AM CT (Bryan),
  # for the defect sprint that dispatches specs 089-120. The instruction was
  # "run everything as opus closer", and this is the only place that can express
  # it: `derive.py` hardcodes `persona=IMPLEMENTER` and *refuses* a `persona:`
  # key in a spec's `## Work Graph`, and neither `build start` nor
  # `roadmap start` has a builder-persona dial — only `--promotion-persona`.
  # So "everything" means this entry and `debugger` below.
  #
  # THE LINEAGE DOCTRINE SURVIVES THE SWAP. The rule this file has carried since
  # 2026-08-07 is that the judge may not review its own family's output (U3).
  # Anthropic now authors and Zhipu still judges, so the constraint holds — it
  # was kimi/glm, it is now opus/glm.
  #
  # WHAT THE PREVIOUS WIRING WAS, so reverting is one edit: kimi was chosen
  # 2026-08-07 ~22:45 CT to extend the homelab's ADR-0016 lineage doctrine —
  # `model: ollama-cloud/kimi-k2.7-code`, `fallback: local/qwen3.6-27b`,
  # `context_window: 262144` (256K per the ollama.com model card,
  # operator-confirmed 2026-08-11; without it the CLI assumes 200k for the
  # unrecognised alias and 62,144 tokens — 23.7% — of every attempt's window are
  # unreachable, measured on 032/us1 via Langfuse).
  #
  # HELD, NOT ABANDONED — 2026-08-29 00:45 CT. The swap below was applied and
  # then reverted within the hour, because it reddens trunk and therefore makes
  # the very sprint it was for undispatchable. Two tests assume the default
  # builder persona routes through the gateway:
  #   tests/test_us2_shipped_registry.py:344  asserts a "/" in implementer.model
  #   tests/test_usage_activities.py:819-834  leases a virtual key for it
  # A subscription persona has neither a slash-shaped alias nor a minted key, so
  # both fail, the gate command fails with them, and no node of any epic can
  # land. Filed as `ci/test-suite-pins-the-operator-dial` — the THIRD recurrence
  # of a defect 037 already un-pinned once for `context_window`.
  #
  # TO APPLY THE SWAP once that finding is fixed, replace the four keys below
  # with:
  #   agent: subscription
  #   model: claude-opus-5
  #   fallback: null
  #   context_window: 1000000
  # and note the cost: the fallback goes away. See the `opus-closer` entry for
  # why a `ollama-cloud/*` fallback cannot be kept on a subscription persona —
  # it holds no gateway key, so such a fallback validates cleanly and then fails
  # at runtime with nothing to authenticate against. A session that cannot
  # refresh therefore has no second route, which is what spec 095 makes legible.
  agent: claude-code
  model: ollama-cloud/kimi-k2.7-code
  fallback: local/qwen3.6-27b
  skills: [implement, tdd]
  write_scope: worktree
  needs_worktree: true
  timeout: 14400
  context_window: 262144

verifier:
  agent: none
  model: null
  fallback: null
  skills: []
  write_scope: read
  needs_worktree: true
  timeout: null

judge:
  agent: claude-code
  # Moved 5.2 -> 5.3 on 2026-08-29 at Bryan's instruction. THE ALIAS IS NOT
  # `ollama-cloud/glm-5.3`: the gateway does not serve that name. Probed against
  # the live proxy on 2026-08-29 — the only 5.3 it serves is
  # `ollama-cloud/glm-5.3-flash`, and a real chat completion against it returned
  # `content='ready'` with `finish_reason=stop`, so this is a verified route and
  # not a listing entry. Re-probe before changing it again; external model
  # catalogs churn, and a judge pointed at an unserved alias fails every call
  # while looking like a broken gateway.
  model: ollama-cloud/glm-5.3-flash
  fallback: local/qwen3.6-27b
  skills: [code-review]
  write_scope: read
  needs_worktree: false
  timeout: 3600

closer:
  agent: claude-code
  # Added 2026-08-13 (Bryan): the rung for a story that has already proved
  # stubborn. Deliberately NOT the debugger — a debugger diagnoses, a closer
  # finishes, so this carries the implementer's skills and write scope, not
  # `diagnosing-bugs`.
  #
  # This is the only persona routed to a metered provider. Everything else on
  # this floor rides the flat-rate Ollama subscription; `anthropic/claude-opus-5`
  # bills per token. That is the whole reason the persona is opt-in: it must
  # cost a decision, not a default.
  #
  # HOW TO USE IT — there is no automatic promotion today, by design and by
  # mechanism. `derive.py` hardcodes `persona=IMPLEMENTER` and *refuses* a
  # `persona:` key in a spec's `## Work Graph`, and `ladder.next_action` knows
  # only `DEBUGGER_PERSONA` by name. So a closer is dispatched by hand:
  #
  #   ergane spec derive <spec-dir> --target-repo <repo> --delta -o graph.json
  #   # edit graph.json: the stubborn node's "persona" -> "closer"
  #   ergane build start graph.json
  #
  # A typo fails closed, but later than you would like: the CLI does NOT catch
  # it (`_persona_registry` in `factory/cli/nouns/build.py` builds the registry
  # out of the graph's own persona names, so `validate_workgraph` can never
  # reject one, and preflight ignores unknown personas too). It is caught by
  # `resolve_graph` at epic start with `GRAPH_INVALID`, before any key is issued
  # or worktree created — cheap, but it costs a workflow rather than a command.
  # Filed as `interpreter/cli-cannot-reject-an-unknown-persona`. Verified live
  # 2026-08-13: a `closer` node resolves to `anthropic/claude-opus-5`, and
  # `clsoer` raises GRAPH_INVALID naming the registry.
  #
  # Promoting automatically on the third attempt is a separate change: it needs
  # `VerificationConfig.max_attempts` and a ladder rung, both factory code, and
  # therefore a spec. Do not hardcode a model name in code to get there —
  # constitution VII routes by persona, and this file is the only place a model
  # alias may appear.
  model: anthropic/claude-opus-5
  # Not the house `local/qwen3.6-27b`: this rung exists because the story is
  # hard, and a 27b local model is not a plausible closer. Falls back to the
  # implementer's own model so an Anthropic outage degrades to today's builder
  # rather than to something weaker than the attempts that already failed.
  fallback: ollama-cloud/kimi-k2.7-code
  skills: [implement, tdd]
  write_scope: worktree
  needs_worktree: true
  timeout: 14400
  # Opus 5's published window is 1M. Unset, the CLI assumes 200k for an alias it
  # does not recognise — the same 037 defect that cost kimi 23.7% of its window.
  # Revert to unset if a routed attempt ever reports a smaller ceiling.
  context_window: 1000000

debugger:
  # Swapped with `implementer` on 2026-08-29 for the defect sprint (Bryan,
  # "run everything as opus closer"). The debugger is the ladder's second rung —
  # `ladder.next_action` knows it by name — so leaving it on deepseek would mean
  # "everything" was true for three attempts and false for the three after,
  # which is the shadowing this sprint's spec 095 is about elsewhere.
  #
  # HELD with `implementer` above, and for the same reason — see that entry.
  # TO APPLY: `agent: subscription`, `model: claude-opus-5`, `fallback: null`,
  # `context_window: 1000000`.
  agent: claude-code
  model: ollama-cloud/deepseek-v4-flash
  fallback: local/qwen3.6-27b
  skills: [diagnosing-bugs]
  write_scope: worktree
  needs_worktree: true
  timeout: 10800

researcher:
  agent: claude-code
  model: ollama-cloud/deepseek-v4-flash
  fallback: local/qwen3.6-27b
  skills: [research, grill-with-docs]
  write_scope: read
  needs_worktree: false
  timeout: 7200

opus-closer:
  # Added 2026-08-20 (Bryan): a builder for a story that has already proved it
  # will not fall to the house implementer. First use is 067/US1, which spent
  # three implementer attempts and the debugger cycle and still escalated.
  #
  # THE DIFFERENCE FROM `closer`, which also points at Opus 5: `closer` reaches
  # it through the LiteLLM alias `anthropic/claude-opus-5`, which is the gateway,
  # which is per-token billing. This persona uses the SUBSCRIPTION route that
  # 070/US2 and 070/US3 built, so it costs no metered API spend.
  #
  # `agent: subscription` is the sentinel at factory/config.py:149. Three
  # consequences, all read out of the tree rather than assumed:
  #   - `routes_through_gateway` is False, so no virtual key is minted and no
  #     preflight runs against the proxy's served-alias list (US2 FR-016).
  #   - the adapter hands the child NEITHER ANTHROPIC_BASE_URL NOR
  #     ANTHROPIC_AUTH_TOKEN — it runs on the CLI's own login (US2 FR-006).
  #   - `discover_subscription_credential` finds that login. Measured on this
  #     host 2026-08-20: it resolves to ~/.claude/.credentials.json, the third
  #     of its three search paths and the one the code's comment names.
  agent: subscription

  # NOT a LiteLLM alias. This value flows untouched into `claude --model`
  # (adapter.py), and `claude --help` documents that flag as taking either an
  # alias for the latest ("opus") or a model's full name. The full name is used
  # deliberately: the bare alias silently follows the next major, and a builder
  # that changes under you is a variable nobody chose.
  #
  # Nothing validates this string — FR-014 requires it be a name the CLI
  # accepts, but config.py adds no check, so a typo fails at the agent rather
  # than at `ergane spec validate`.
  model: claude-opus-5

  # Deliberately null. `closer` falls back to kimi because it HOLDS a gateway
  # key; this persona does not, so a `ollama-cloud/*` fallback would validate
  # cleanly here and then fail at runtime with nothing to authenticate against.
  # Failing honestly on the subscription beats failing confusingly off it.
  fallback: null

  skills: [implement, tdd]
  write_scope: worktree
  needs_worktree: true
  timeout: 14400
  # Opus 5's published window. Unset, the CLI assumes 200k for an alias it does
  # not recognise — the 037 defect that cost kimi 23.7% of its window.
  context_window: 1000000
